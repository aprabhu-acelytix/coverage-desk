# Coverage Desk local Socket Mode application. No channel-history scopes required.
# Create the xapp- token separately with the app-level connections:write scope.
_metadata:
  major_version: 1
display_information:
  name: Coverage Desk
  description: Explore coverage, inspect message evidence, and share team briefings.
  background_color: "#24323D"
features:
  app_home:
    home_tab_enabled: true
    messages_tab_enabled: true
    messages_tab_read_only_enabled: true
  bot_user:
    display_name: Coverage Desk
    always_online: false
  slash_commands:
    - command: /coverage
      description: Open Coverage Desk
      usage_hint: Open your coverage workspace
      should_escape: true
oauth_config:
  scopes:
    bot:
      - commands
      - chat:write
      - channels:read
settings:
  event_subscriptions:
    bot_events:
      - app_home_opened
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
